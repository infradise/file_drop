name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve package dependencies
        run: flutter pub get

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run static analysis (package)
        run: flutter analyze

      - name: Run static analysis (example)
        working-directory: example
        run: flutter analyze

      - name: Run unit and widget tests (package)
        run: flutter test

      - name: Run widget tests (example)
        working-directory: example
        run: flutter test

  build-desktop:
    name: Build Desktop (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux GTK3 build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Configure Flutter desktop target
        run: flutter config --enable-${{ matrix.platform }}-desktop

      - name: Enable Swift Package Manager on macOS
        if: matrix.platform == 'macos'
        run: flutter config --enable-swift-package-manager

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example (${{ matrix.platform }} debug)
        working-directory: example
        run: flutter build ${{ matrix.platform }} --debug

  build-web:
    name: Build Web (Wasm)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example (WebAssembly)
        working-directory: example
        run: flutter build web --wasm

  build-mobile:
    name: Build Mobile (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: android
          - os: macos-latest
            platform: ios
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17 for Android
        if: matrix.platform == 'android'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Enable Swift Package Manager on iOS
        if: matrix.platform == 'ios'
        run: flutter config --enable-swift-package-manager

      - name: Resolve example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build example (Android debug APK)
        if: matrix.platform == 'android'
        working-directory: example
        run: flutter build apk --debug

      - name: Build example (iOS Simulator debug)
        if: matrix.platform == 'ios'
        working-directory: example
        run: flutter build ios --simulator --debug --no-codesign
